[tool.ruff]
target-version = "py311"
line-length = 88

# Проверяем весь Python‑код в backend
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "DJ",  # django
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

